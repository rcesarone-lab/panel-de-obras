name: Actualizar panel de obras

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 Argentina (UTC-3), todos los días
  workflow_dispatch: {}     # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright jinja2
          playwright install --with-deps chromium

      - name: Correr scraper
        run: python scraper/scrape_jobs.py

      - name: Generar sitio
        run: python scraper/build_site.py

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
